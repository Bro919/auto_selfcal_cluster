# Slurm email notification config for jobs created by this project.
#
# To enable notifications, uncomment the lines below and replace the values
# with your email address and the Slurm mail events you want to receive.
#
# Example:
# mail_type = END,FAIL  #BEGIN,END,FAIL,REQUEUE,ALL
# mail_user = your.name@example.com
#
# Leave this file unchanged (or comment everything out) to keep mail disabled.
# The wrapper will silently ignore invalid or empty values.
